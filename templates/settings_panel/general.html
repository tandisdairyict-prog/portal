{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}تنظیمات عمومی{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-gear me-2"></i>تنظیمات عمومی سایت</h5>
                <a href="{% url 'settings_panel:ad-config' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-server me-1"></i>تنظیمات AD
                </a>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% crispy form %}
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
