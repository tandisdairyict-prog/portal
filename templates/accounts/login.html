{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}ورود به پورتال{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-grid-3x3-gap-fill text-primary" style="font-size: 3rem;"></i>
                    <h4 class="mt-2 mb-0">ورود به پورتال سازمانی</h4>
                </div>
                <div class="alert alert-info" role="alert">
                    <i class="bi bi-info-circle me-2"></i>
                    ورود با اکتیو دایرکتوری (AD) در صورت فعال بودن به صورت خودکار انجام می‌شود.
                </div>
                {% crispy form %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
